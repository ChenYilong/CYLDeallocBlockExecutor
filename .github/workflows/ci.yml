# local-run-environment: macOS 27.3, Xcode 27.2 (27B52)
# CI for CYLDeallocBlockExecutor on GitHub-hosted runners (free for public repositories).
# Runner: `macos-26`, the same as CYLTabBarController. Set the repository variable MACOS_RUNNER to try another image
# (for example `xcode-27`) without editing this file.
name: CI

on:
  pull_request:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck Tests/*.sh

  build:
    name: SPM + Example build
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-26' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Versions
        run: sw_vers && xcodebuild -version
      # xcodebuild picks the .xcodeproj over Package.swift in the same folder, so the package builds from a copy.
      - name: Swift Package (warnings are errors)
        run: |
          PKG="$RUNNER_TEMP/package"
          mkdir -p "$PKG"
          cp -R Package.swift CYLDeallocBlockExecutor "$PKG/"
          cd "$PKG"
          xcodebuild build -scheme CYLDeallocBlockExecutor -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd-spm" SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
      - name: Example app
        run: |
          xcodebuild build -project CYLDeallocBlockExecutor.xcodeproj -target CYLDeallocBlockExecutor \
            -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO \
            SYMROOT="$RUNNER_TEMP/build-example"

  carthage:
    name: Carthage
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-26' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Build the shared framework scheme
        run: |
          brew list carthage >/dev/null 2>&1 || brew install carthage
          carthage version
          carthage build --no-skip-current --use-xcframeworks --platform iOS
          ls Carthage/Build/CYLDeallocBlockExecutor.xcframework

  lint:
    name: pod lib lint
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-26' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: pod --version && pod lib lint

  lifecycle-tests:
    name: Lifecycle tests (${{ matrix.configuration }})
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-26' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        configuration: [ debug, release ]
    steps:
      - uses: actions/checkout@v5
      - name: Boot an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .key as $runtime | .value[] | select(.name | startswith("iPhone")) | .runtime = $runtime] | last | "\(.udid) \(.runtime)"')
          RUNTIME="${UDID#* }"
          UDID="${UDID%% *}"
          echo "Runtime: $RUNTIME"
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            xcrun simctl list devices available
            echo "No iPhone simulator found" >&2
            exit 1
          fi
          xcrun simctl list devices available | grep "$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Run (exchange swizzle after and before the hooks)
        env:
          CYL_TEST_CONFIGURATION: ${{ matrix.configuration }}
        run: bash Tests/run-lifecycle-tests.sh "${{ steps.sim.outputs.udid }}"
