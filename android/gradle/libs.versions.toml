# Versions of the Android port, in one place. Same AGP and Kotlin as CYLTabBarController's Example-Android.
[versions]
agp = "8.7.3"
kotlin = "2.0.21"
# Same as appcompat 1.7.0 resolves in CYLTabBarController's Android core, so the dependency does not raise its lifecycle version.
lifecycle = "2.6.2"
junit = "4.13.2"
coroutines = "1.8.1"

[libraries]
androidx-lifecycle-common = { module = "androidx.lifecycle:lifecycle-common", version.ref = "lifecycle" }
androidx-lifecycle-runtime-testing = { module = "androidx.lifecycle:lifecycle-runtime-testing", version.ref = "lifecycle" }
junit = { module = "junit:junit", version.ref = "junit" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
